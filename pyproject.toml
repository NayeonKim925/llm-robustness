[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-robustness"
description = "Controlled context-perturbation evaluation and calibration of small LMs on RumourEval-2019 stance classification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nayeon Kim", email = "nayeonkim1322@gmail.com" }]
keywords = ["nlp", "stance-detection", "robustness", "calibration", "rumoureval", "lora"]
dynamic = ["version"]

# Core install stays light: the pure-Python package (labels, metrics, data,
# prompts, config) needs only PyYAML. Heavy ML libraries are opt-in extras so
# `pip install -e .` is fast on a laptop and only the GPU box pulls torch.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "numpy>=1.24"]         # analysis + figures (CPU)
gpu = [                                           # training / eval / calibration
    "torch>=2.1",
    "transformers>=4.44",
    "datasets>=2.19",
    "peft>=0.11",
    "trl>=0.9",
    "accelerate>=0.30",
]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/NayeonKim925/llm-robustness"

# Console entry points -> run the pipeline without `python scripts/...`.
[project.scripts]
llmr-dataset = "llm_robustness.cli:build_dataset_main"
llmr-analyze = "llm_robustness.cli:analyze_main"
llmr-figures = "llm_robustness.cli:figures_main"
llmr-significance = "llm_robustness.cli:significance_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "llm_robustness.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
